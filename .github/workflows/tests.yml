name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  APP_ENV: testing
  APP_DEBUG: 'false'
  DB_CONNECTION: sqlite
  DB_DATABASE: ':memory:'
  DB_URL: '(null)'
  CACHE_STORE: array
  SESSION_DRIVER: array
  QUEUE_CONNECTION: sync
  MAIL_MAILER: array

jobs:
  quality:
    name: Quality and static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare isolated application
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction
          php artisan config:clear
      - run: vendor/bin/pint --test
      - name: PHP syntax
        run: git ls-files -z -- '*.php' | xargs -0 -r -n 1 php -l
      - run: node --check public/js/tasks.js
      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M
      - name: Validate workflow configuration
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, sqlite3
          tools: composer:v2
          coverage: none
      - name: Locate Composer download cache
        id: composer-cache
        run: echo "directory=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.directory }}
          key: composer-${{ runner.os }}-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare isolated application
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction
          php artisan config:clear
          mkdir -p test-results
      - name: Unit tests
        id: unit
        run: php vendor/bin/phpunit --testsuite=Unit --log-junit test-results/unit.xml
      - name: Integration tests
        if: ${{ !cancelled() && (steps.unit.outcome == 'success' || steps.unit.outcome == 'failure') }}
        run: php vendor/bin/phpunit --testsuite=Feature --log-junit test-results/integration.xml
      - name: Publish test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-php-${{ matrix.php }}
          path: test-results/*.xml
          if-no-files-found: ignore
          retention-days: 7

  security:
    name: Dependency and secret checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - run: composer audit --locked --no-interaction
      - name: Scan Git history for secrets
        if: ${{ !cancelled() }}
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact=100 --no-banner --log-opts='--all'

  build:
    name: Production dependency and build check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: task_ci
          POSTGRES_PASSWORD: task_ci_only
          POSTGRES_DB: task_manager_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U task_ci -d task_manager_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: production
      APP_URL: http://127.0.0.1
      DB_CONNECTION: pgsql
      DB_URL: postgresql://task_ci:task_ci_only@127.0.0.1:5432/task_manager_ci
      DB_MIGRATION_URL: postgresql://task_ci:task_ci_only@127.0.0.1:5432/task_manager_ci
      DB_SSLMODE: disable
      DB_VERIFY_SERVER_CERTIFICATE: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_pgsql
          tools: composer:v2
          coverage: none
      - run: composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader
      - name: Prepare disposable build environment
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction
          php artisan config:clear
      - run: php artisan view:cache
      - name: Exercise deployment build against CI PostgreSQL only
        run: composer run vercel
      - name: Verify required assets
        run: |
          test -s public/css/tasks.css
          test -s public/js/tasks.js
          test -s public/vendor/bootstrap/bootstrap.min.css
          test -s public/vendor/bootstrap/bootstrap.bundle.min.js
          test -s public/vendor/jquery/jquery.min.js
          test -s public/vendor/sortable/Sortable.min.js
          test -s certs/cacert.pem

  passed:
    name: CI passed
    needs: [quality, tests, security, build]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every job to succeed
        env:
          QUALITY: ${{ needs.quality.result }}
          TESTS: ${{ needs.tests.result }}
          SECURITY: ${{ needs.security.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          for result in "$QUALITY" "$TESTS" "$SECURITY" "$BUILD"; do
            if [ "$result" != success ]; then
              echo 'A required CI job did not succeed.' >&2
              exit 1
            fi
          done
